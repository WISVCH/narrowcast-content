[project]
name = "narrowcast_content"
version = "1.0.0"
description = "Various screens to show on a narrowcast presenter."
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask",
    "Flask-Caching",
    "spotipy",
    "icalendar",
    "waitress",
    "PasteDeploy",
    "paste",
    "pytz",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff.lint]
extend-select = ["UP"]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"
