name: Python quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.14"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check --select E9,F63,F7,F82 .
      - name: Check Python syntax
        run: uv run python -m compileall -q narrowcast_content config.py
      - name: Smoke test application import and health endpoint
        run: uv run python -c "from narrowcast_content import app; assert app.test_client().get('/health').status_code == 200"
        env:
          FLASK_DATA_PATH: /tmp/narrowcast-content-data
